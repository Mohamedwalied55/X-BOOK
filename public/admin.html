<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | XBOOK CONTROL ROOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131b2a;
      --border: #1e293b;
      --primary: #10b981;
      --primary-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --wa-color: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
    h1 { font-size: 24px; color: var(--primary); font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
    h2 { font-size: 18px; margin-bottom: 15px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: right; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--text-muted); font-weight: 500; }
    
    .btn { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
    .btn:hover { background: var(--primary-hover); }
    .btn-wa { background: var(--wa-color); color: #fff; }
    .btn-wa:hover { opacity: 0.9; }
    
    select, input, textarea { width: 100%; background: #0b0f17; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .status-select { width: auto; padding: 4px 8px; font-size: 13px; }
    .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginView" class="card login-box">
      <h1>XBOOK ADMIN</h1>
      <p style="margin-bottom: 20px; color: var(--text-muted);">تسجيل الدخول للوحة التحكم</p>
      <input type="email" id="email" placeholder="البريد الإلكتروني" />
      <input type="password" id="password" placeholder="كلمة المرور" />
      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="login()">تسجيل الدخول</button>
    </div>

    <div id="dashboardView" style="display: none;">
      <header>
        <h1>XBOOK CONTROL ROOM</h1>
        <button class="btn" style="background: var(--danger); color: #fff;" onclick="logout()">تسجيل خروج</button>
      </header>

      <div class="card">
        <h2>الطلبات الواردة (Orders)</h2>
        <table>
          <thead>
            <tr>
              <th>المهمة</th>
              <th>العميل</th>
              <th>الهاتف</th>
              <th>المحافظة والعنوان</th>
              <th>الإجمالي</th>
              <th>الحالة</th>
              <th>تحديث وإشعار الواتساب</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('adminToken');
    if (token) showDashboard();

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('adminToken', data.token);
        token = data.token;
        showDashboard();
      } else {
        alert(data.error || 'خطأ في الدخول');
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      loadData();
    }

    async function loadData() {
      const res = await fetch('/api/admin/data', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) return logout();
      const data = await res.json();

      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = data.orders.map(o => `
        <tr>
          <td><b>#X-${o.id}</b></td>
          <td>${o.customer_name}</td>
          <td>${o.phone}</td>
          <td>${o.governorate} - ${o.address}</td>
          <td><b>${o.total} ج.م</b></td>
          <td>
            <select class="status-select" id="status-${o.id}">
              ${['جديد', 'قيد التجهيز', 'تم الشحن', 'مكتمل', 'ملغي'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td>
            <button class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="updateStatus(${o.id})">حفظ والحصول على رابط الواتساب</button>
            <span id="wa-container-${o.id}"></span>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id) {
      const status = document.getElementById(`status-${id}`).value;
      const res = await fetch('/api/admin/orders/' + id, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ status })
      });
      const data = await res.json();
      if (res.ok) {
        const waBtn = `<a href="${data.whatsapp_link}" target="_blank" class="btn btn-wa" style="padding: 4px 10px; font-size: 12px; margin-right: 5px;">📱 إرسال للواتساب</a>`;
        document.getElementById(`wa-container-${id}`).innerHTML = waBtn;
        alert('تم تحديث حالة الطلب بنجاح! يمكنك الآن الضغط على زر الواتساب لإشعاره.');
      } else {
        alert(data.error);
      }
    }
  </script>
</body>
</html>
